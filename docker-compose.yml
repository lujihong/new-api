version: '3.8'

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://postgres:lujihong123@mypgsql:5432/newapi
      - REDIS_CONN_STRING=redis://:lujihong123@redis:6379/0
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=token-profitly-cn
      - SESSION_SECRET=0f57ec754f3c10e6bc2fdafc75c284f47d04b2e582118497c39671baf880b491
      - SESSION_COOKIE_SECURE=true
      - SESSION_COOKIE_TRUSTED_URL=https://token.profitly.cn
      - FRONTEND_BASE_URL=https://token.profitly.cn
      - TRUSTED_PROXIES=127.0.0.1,172.18.0.0/16
    networks:
      - mynet
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mynet:
    external: true
